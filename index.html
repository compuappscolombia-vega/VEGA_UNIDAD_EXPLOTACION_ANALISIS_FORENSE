    <meta charset="UTF-8" />
    <script>
      (function() {
        function isExtensionError(str) {
          if (!str) return false;
          var text = String(str);
          return text.indexOf('chrome-extension://') !== -1 ||
                 text.indexOf('moz-extension://') !== -1 ||
                 text.indexOf('MetaMask') !== -1 ||
                 text.indexOf('Failed to connect to MetaMask') !== -1 ||
                 text.indexOf('ethereum') !== -1 ||
                 text.indexOf('inpage.js') !== -1;
        }

        function extractErrorInfo(val) {
          if (!val) return '';
          if (typeof val === 'string') return val;
          return String(val.message || '') + ' ' + String(val.stack || '') + ' ' + String(val);
        }

        // Intercept global window.onerror
        var oldOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var combined = String(message || '') + ' ' + String(source || '') + ' ' + extractErrorInfo(error);
          if (isExtensionError(combined)) {
            return true; // suppresses browser error reporting
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
          return false;
        };

        // Capture error events at capture phase
        window.addEventListener('error', function(e) {
          var combined = String(e.message || '') + ' ' + String(e.filename || '') + ' ' + extractErrorInfo(e.error);
          if (isExtensionError(combined)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Capture unhandled rejections at capture phase
        window.addEventListener('unhandledrejection', function(e) {
          var combined = extractErrorInfo(e.reason);
          if (isExtensionError(combined)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Filter console.error and console.warn so third-party extension failures do not trigger dev harness errors
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var allText = args.map(extractErrorInfo).join(' ');
          if (isExtensionError(allText)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var allText = args.map(extractErrorInfo).join(' ');
          if (isExtensionError(allText)) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
