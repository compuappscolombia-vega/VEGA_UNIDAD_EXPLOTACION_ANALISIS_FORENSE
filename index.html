    <meta charset="UTF-8" />
    <script>
      (function() {
        function isExtensionError(msg, src) {
          var text = String(msg || '') + ' ' + String(src || '');
          return text.includes('chrome-extension://') || 
                 text.includes('MetaMask') || 
                 text.includes('Failed to connect to MetaMask') ||
                 text.includes('ethereum') ||
                 text.includes('inpage.js');
        }
        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message, e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || e.reason.stack || String(e.reason)) : '';
          if (isExtensionError(reason, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
